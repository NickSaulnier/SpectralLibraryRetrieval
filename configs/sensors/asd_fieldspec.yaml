name: field_asd
description: ASD FieldSpec-class field spectrometer, 1 nm output grid, 350-2500 nm
band_source: grid
grid_nm: [350, 2500, 1]
# Native resolution by detector (FieldSpec 4 Standard-Res; Hi-Res is 3/8/8 nm).
fwhm_nm:
  - [350, 1000, 3.0]
  - [1001, 1800, 10.0]
  - [1801, 2500, 10.0]
bad_band_sets: [field_water, edges]
