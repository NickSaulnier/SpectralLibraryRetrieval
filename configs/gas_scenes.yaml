# EMIT scenes for gas plume work (PLAN_GAS.md, Phase G0).
# Chosen 2026-10-31 by ranking scenes on the number of EMIT L2B CH4PLM / CO2PLM plume
# complexes they contain (CMR metadata), then preferring low cloud and low solar zenith.
# Versions are the newest set that exists for every scene: L1B/L2A/L2B MIN v001 and the
# GHG products v002 (the v003 enhancement products do not cover these granules).
#
# `products` keys are defined in specret.io.download.EMIT_PRODUCTS. The no-plume scenes
# already have L2A RFL and L2B MIN under data/scenes, so they only need radiance and the
# enhancement maps.

out_dir: data/scenes/emit_gas

scenes:
  - id: 20230608T162322_2315911_014
    site: Permian Basin, Texas (Delaware sub-basin)
    role: plume
    gases: [CH4]
    notes: 7 CH4 plume complexes; cloud 19%; SZA 34
    products: [l1b, l2a, min, ch4enh, co2enh, ch4plm]
