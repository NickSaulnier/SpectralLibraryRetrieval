# Plume detection settings (PLAN_GAS.md). Wavelengths in nm.

matched_filter:
  # Bands used by the matched filter, as [lo, hi] ranges. They are much wider than the diagnostic
  # windows in gases.yaml: bands without gas absorption still describe the background, which
  # lowers the noise. These are the ranges of the EMIT GHG v002 products. Line-by-line spectra
  # are computed where HITRAN tables cover a range (1493-2532 nm); elsewhere k is taken as 0.
  windows:
    CH4: [[500, 1340], [1500, 1790], [1950, 2450]]
    CO2: [[500, 1340], [1500, 1790], [1950, 2450]]
  shrinkage: loo       # covariance shrinkage: "loo" (leave-one-out per column) or a fixed 0-1
  n_pass: 2            # 2 = recompute the background without first-pass plume pixels
  exclude_sigma: 3.0   # second pass: drop pixels above this many robust sigmas from the statistics
  min_pixels_factor: 2 # a column needs at least this many valid pixels per band, or it is left empty
  flare_radiance: 1.5  # radiance at 2389 nm above which a pixel is a flare (uW/cm2/sr/nm), as EMIT
  flare_dilation_px: 2 # flares are screened with this margin

# Line-by-line spectroscopy used to build the unit absorption spectra (gas/library.py).
library:
  step_cm1: 0.01
  wing_cm1: 25.0
  margin_nm: 30.0      # computed beyond each window, so band responses near its edges are complete
  background_gases: [H2O, CO2, CH4]
  # Gases fitted in plumes but absent from the background model. HITRAN has no VSWIR lines for
  # C2H6 (cross-sections only), so it is not here yet.
  plume_gases: [N2O, CO, NH3, H2S]

# Surface materials that can mimic gas absorption (gas/confusers.py). Each class is a regular
# expression on library material names; its signature is the mean continuum-removed log
# reflectance of those spectra.
confusers:
  classes:
    calcite: "Calcite|Calcite_REE-bearing"
    dolomite: "Dolomite"
    other_carbonate: 'Magnesite\+Hydromag|Siderite'
    hydrocarbon: "Asphalt.*|Kerogen.*|Oil(75|92)_Water.*|Oil_BlackPoolonBeach|Tar_Paper"
    plastic: "Plastic.*|Polystyrene|Nylon_.*|Polyester_.*"
  # L2B MIN ~2 µm mineral groups that flag a candidate (taxonomy groups)
  mineral_groups: [calcite, dolomite, other_carbonate]
  mineral_flag_fraction: 0.3  # flag when at least this share of a candidate's pixels is one

# Candidate plumes (gas/plumes.py): hysteresis on the 1-px-smoothed z map of each column
candidates:
  z_high: 5.0
  z_low: 2.5
  min_px: 5

# Gas identification (gas/identify.py)
identify:
  fit_windows: [[1500, 1790], [1950, 2450]]
  gases: [CH4, CO2, H2O, N2O, CO, NH3, H2S]
  named_gases: [CH4, CO2]  # only these can be the identified gas (gases.yaml quantify: vswir)
  flag_penalty: 3.0        # flag-only gases need this many times the BIC penalty to enter
  max_terms: 3
  null_samples: 300     # shifted copies of a candidate's mask, for its background covariance
  # A candidate is reported as a plume of its named gas at or above this calibrated confidence.
  # Chosen for about 1 false plume per 1000 km² on the no-plume scenes (results/gas_g2_identification.md).
  confidence_threshold: 0.2

# Emission rates (gas/quantify.py): Q = IME * U_eff / sqrt(plume area)
quantify:
  # U_eff = a * U10 + b for EMIT's 60 m pixels, from large-eddy simulations
  # (Ferrari et al. 2025, arXiv 2506.01113; PRISMA 0.37/0.70, EnMAP 0.37/0.69)
  u_eff: [0.45, 0.67]
  wind_min_relative_sd: 0.5  # wind uncertainty is at least this share of the speed
  # Relative IME error not captured by the shifted-mask background: the spread of measured IME
  # against the true mass inside the mask on injected CH4 plumes (results/gas_g3_quantification.md)
  retrieval_rel_sd: 0.3
